name: Tests

on:
  pull_request:
  push:
    branches: [main, develop, feature/comprehensive-e2e-tests]
  workflow_dispatch:

jobs:
  vitest-unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unit
          name: unit-tests

  vitest-msw:
    name: Vitest MSW Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MSW integration tests
        run: pnpm test:msw

  php-integration:
    name: PHP Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start wp-env
        run: pnpm env:start

      - name: Wait for WordPress initialization
        run: sleep 30

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress to respond..."
          timeout 180 bash -c 'until curl -sf http://localhost:8888/wp-admin/admin-ajax.php; do echo "Waiting..."; sleep 3; done'
          echo "WordPress is ready!"

      - name: Run PHP integration tests
        run: pnpm test:integration

      - name: Stop wp-env
        if: always()
        run: pnpm env:stop

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start wp-env
        run: pnpm env:start

      - name: Wait for WordPress initialization
        run: sleep 30

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress to respond..."
          timeout 180 bash -c 'until curl -sf http://localhost:8888/wp-admin/admin-ajax.php; do echo "Waiting..."; sleep 3; done'
          echo "WordPress is ready!"

      - name: Run Playwright E2E tests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TEST_TOKEN }}
          CI: true
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: pnpm env:stop

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [vitest-unit, vitest-msw, php-integration, playwright-e2e]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Test Results Summary:"
          echo "===================="
          echo "Vitest Unit: ${{ needs.vitest-unit.result }}"
          echo "Vitest MSW: ${{ needs.vitest-msw.result }}"
          echo "PHP Integration: ${{ needs.php-integration.result }}"
          echo "Playwright E2E: ${{ needs.playwright-e2e.result }}"

      - name: Fail if any tests failed
        if: |
          needs.vitest-unit.result == 'failure' ||
          needs.vitest-msw.result == 'failure' ||
          needs.php-integration.result == 'failure' ||
          needs.playwright-e2e.result == 'failure'
        run: exit 1
