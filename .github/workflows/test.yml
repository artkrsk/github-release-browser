name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  vitest-unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unit
          name: unit-tests

  vitest-msw:
    name: Vitest MSW Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MSW integration tests
        run: pnpm test:msw

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [vitest-unit, vitest-msw]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Test Results Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Vitest Unit Tests: ${{ needs.vitest-unit.result }}"
          echo "Vitest MSW Tests:  ${{ needs.vitest-msw.result }}"
          echo ""
          echo "✅ CI validates 676 tests (668 unit + 8 MSW)"
          echo ""
          echo "📝 Note: PHP Integration (105 tests) and E2E (60 tests)"
          echo "   are disabled in CI due to wp-env timing issues."
          echo "   See: WordPress/Gutenberg#61627"
          echo ""
          echo "🏠 Run locally before merging:"
          echo "   pnpm test:integration"
          echo "   pnpm test:e2e"

      - name: Fail if any tests failed
        if: |
          needs.vitest-unit.result == 'failure' ||
          needs.vitest-msw.result == 'failure'
        run: exit 1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Disabled Jobs (wp-env timing issues in CI)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# The following jobs are disabled because wp-env doesn't initialize reliably
# in GitHub Actions CI environment. Both jobs timeout waiting for WordPress
# to respond even with 30s initialization wait + 180s curl polling.
#
# These tests work perfectly locally and are validated via pre-push hooks:
#   - PHP Integration: 105 tests (via captainhook pre-push)
#   - Playwright E2E: 60 tests (run manually: pnpm test:e2e)
#
# TODO: Re-enable when wp-env CI timing issues are resolved
# Reference: https://github.com/WordPress/gutenberg/issues/61627
#
# Commented out jobs:
# - php-integration (105 PHP tests with wp-env)
# - playwright-e2e (60 browser automation tests with wp-env)
