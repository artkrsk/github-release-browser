name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  vitest-unit:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unit
          name: unit-tests

  vitest-msw:
    name: Vitest MSW Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '23'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MSW integration tests
        run: pnpm test:msw

  php-unit:
    name: PHP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHP unit tests
        run: composer test

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [vitest-unit, vitest-msw, php-unit]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Vitest Unit: ${{ needs.vitest-unit.result }}"
          echo "Vitest MSW:  ${{ needs.vitest-msw.result }}"
          echo "PHP Unit:    ${{ needs.php-unit.result }}"

      - name: Fail if any tests failed
        if: |
          needs.vitest-unit.result == 'failure' ||
          needs.vitest-msw.result == 'failure' ||
          needs.php-unit.result == 'failure'
        run: exit 1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Disabled Jobs (wp-env timing issues in CI)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# The following jobs are disabled because wp-env doesn't initialize reliably
# in GitHub Actions CI environment. Both jobs timeout waiting for WordPress
# to respond even with 30s initialization wait + 180s curl polling.
#
# These tests work perfectly locally and are validated via pre-push hooks:
#   - PHP Integration: 105 tests (via captainhook pre-push)
#   - Playwright E2E: 60 tests (run manually: pnpm test:e2e)
#
# TODO: Re-enable when wp-env CI timing issues are resolved
# Reference: https://github.com/WordPress/gutenberg/issues/61627
#
# Commented out jobs:
# - php-integration (105 PHP tests with wp-env)
# - playwright-e2e (60 browser automation tests with wp-env)
